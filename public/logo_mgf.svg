<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
    <defs>
        <!-- Gradients pour les barres verticales -->
        <linearGradient id="yellowBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFFCE2" />
            <stop offset="100%" stop-color="#FFDD6B" />
        </linearGradient>
        <linearGradient id="tealBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#E5FBF7" />
            <stop offset="100%" stop-color="#2EC4B6" />
        </linearGradient>
        <linearGradient id="redBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#FFF0F0" />
            <stop offset="100%" stop-color="#FF8282" />
        </linearGradient>

        <!-- Gradient pour la vague bleue du bas -->
        <linearGradient id="blueWaveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#29B6F6" />
            <stop offset="100%" stop-color="#0288D1" />
        </linearGradient>
    </defs>

    <!-- Barre Jaune (Gauche) -->
    <rect x="70" y="140" width="200" height="530" rx="100" ry="100" fill="url(#yellowBarGrad)" stroke="#1e293b" stroke-width="2" stroke-opacity="0.15" />

    <!-- Barre Turquoise (Milieu) -->
    <rect x="375" y="80" width="220" height="650" rx="110" ry="110" fill="url(#tealBarGrad)" stroke="#1e293b" stroke-width="2" stroke-opacity="0.15" />

    <!-- Barre Rouge / Corail (Droite) -->
    <rect x="680" y="200" width="210" height="500" rx="105" ry="105" fill="url(#redBarGrad)" stroke="#1e293b" stroke-width="2" stroke-opacity="0.15" />

    <!-- Vague Bleue en bas -->
    <path d="M 0,530 C 250,420 600,450 1000,750 L 1000,1020 L 0,1020 Z" fill="url(#blueWaveGrad)" />

    <!-- Texte "Micro-Gestion-Facile" -->
    <text x="500" y="855" 
          fill="#FFFFFF" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-weight="900" 
          font-size="94" 
          font-stretch="condensed"
          text-anchor="middle" 
          letter-spacing="-1px">
        Micro-Gestion-Facile
    </text>
</svg>
